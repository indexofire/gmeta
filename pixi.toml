[workspace]
authors = ["indexofire <indexofire@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "gmeta"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
check = "ruff check src/ tests/ && ruff format --check src/ tests/"
fix = "ruff check --fix src/ tests/ && ruff format src/ tests/"
typecheck = "pyright src/gmeta/"
test = "pytest tests/ -q"
cov = "pytest tests/ -q --cov=src/gmeta --cov-report=term-missing"
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"

[dependencies]
python = ">=3.12,<3.13"
kraken2 = ">=2.1.3"
bracken = ">=2.9"
sylph = ">=1.0"
fastp = ">=0.24"
minimap2 = ">=2.28,<3"
bowtie2 = ">=2.5"
samtools = ">=1.19"
centrifuge = ">=1.0.4"
kaiju = ">=1.10"
metaphlan = ">=4.0"
kmcp = ">=0.9"
pango = ">=1.50"

[pypi-dependencies]
gmeta = { path = ".", editable = true }
click = ">=8.1"
jinja2 = ">=3.1"
openpyxl = ">=3.1"
pydantic = ">=2.7"
pyyaml = ">=6.0"
rich = ">=13"
weasyprint = ">=62"

[feature.dev.pypi-dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.5"
pyright = ">=1.1"
mkdocs = ">=1.6"
mkdocs-material = ">=9.0"
mkdocs-static-i18n = ">=1.2"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
